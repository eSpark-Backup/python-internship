<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <title>eSpark Portal</title>
    <style>
        body {
            background: linear-gradient(rgb(255, 255, 255), rgba(98, 184, 199, 0.466));
            background-size: cover;
            background-repeat: repeat;
            background-attachment: fixed;
        }

        #bodies {
            margin: 30px;
        }

        #main-blue {
            background-color: #01496D;
            height: 20px;
        }

        #logo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        #portal {
            font-size: 50px;
            font-weight: bold;
            font-family: serif;
            color: #009faa;
        }

        #no-logs a {
            text-decoration: none;
        }

        #no-logs a p {
            text-align: right;
            font-size: 25px;
            font-family: sans-serif;
            color: #00B0B4;
        }

        #no-logs a:hover p {
            text-align: right;
            font-size: 25px;
            font-family: sans-serif;
            color: #008688;
        }

        #inputs {
            background-color: #00a0a042;
            width: 40%;
            margin: auto;
            margin-top: 95px;
            padding-top: 2%;
            padding-bottom: 2%;
        }

        #inputs h2 {
            text-align: center;
            color: #0095a0;
            font-weight: bold;
            font-family: serif;
            font-size: 40px;
        }

        #files {
            display: block;
            margin: auto;
            width: 40%;
            margin-top: 2%;
            padding: 5px;
            color: #0095a0;
            font-size: 20px;
            border-radius: 5px;
            text-align: center;
        }


        #files::file-selector-button {
            background-color: #00478ab7;
            color: #ffffff;
            padding: 5px;
            border-radius: 5px;
            text-align: center;
            border: none;
        }

        .keyword {
            display: block;
            width: 400px;
            margin: auto;
            margin-top: 5px;
            margin-bottom: 5px;
            padding: 3px;
            outline: none;
            border: none;
            background-color: #269da560;
            color: #ffffff;
            font-size: 18px;
            font-weight: 450;
        }

        #submit {
            display: block;
            margin: auto;
            margin-bottom: 2%;
            padding: 3px;
            background: #0158aa;
            border: none;
            color: #ffffff;
            font-size: 20px;
            width: 150px;
            border-radius: 10px;
        }

        #footer {
            position: absolute;
            bottom: 35px;
            width: 97%;
        }

        #greens {
            padding: 3px;
            background-color: #00B0B4;
        }

        #greys {
            padding: 3px;
            background-color: #B5B5B5;
        }

        #blues {
            padding: 15px;
            background-color: #01496D;
        }

        #error {
            margin: auto;
            width: 100%;
            text-align: center;
            margin-top: 2%;
        }

        .alert {
            padding: 3px;
            width: 50%;
            margin: auto;
            margin-bottom: 10px
        }
    </style>

</head>

<body>
    <div id="bodies">

        <div id="heading">
            <div id="main-blue">
            </div>

            <div id="logo">

                <span id="logo-img">
                    <img src="/static/es_logo.png" alt="">
                </span>

                <div id="portal">
                    eSpark Portal
                </div>

                <div id="no-logs">
                    <a href="/logout">
                        <p><b>Logout</b></p>
                    </a>
                </div>

            </div>

            <div id="main-blue">
            </div>
        </div>


        <div id="inputs">

            <h2>
                ATS System
            </h2>
            <form id="folderForm" enctype="multipart/form-data" method="post">
                {% csrf_token %}
                <input type="file" name="files" webkitdirectory directory multiple id="files" required>
                <input type="text" name="keywords[]" class="keyword" placeholder="Enter keyword" required
                    autocomplete="off">
                <input type="text" name="keywords[]" class="keyword" placeholder="Enter keyword" required
                    autocomplete="off">
                <input type="text" name="keywords[]" class="keyword" placeholder="Enter keyword" required
                    autocomplete="off">
                <input type="text" name="keywords[]" class="keyword" placeholder="Enter keyword" required
                    autocomplete="off">
                <input type="text" name="keywords[]" class="keyword" placeholder="Enter keyword" required
                    autocomplete="off">
                <div id="error">
                    {% if error_message %}
                    <div class="alert alert-danger" role="alert">{{ error_message }}</div>
                    {% endif %}
                </div>
                <input type="submit" value="Submit" id="submit">
            </form>
        </div>

        <div id="footer">
            <div id="greens"></div>
            <div id="greys"></div>
            <div id="blues"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

    <script>
        $(document).ready(function () {
            $('#folderForm').on('submit', function () {
                // Store a reference to the form
                var form = this;

                // Reload the page after a short delay (adjust the delay as needed)
                setTimeout(function () {
                    // Reset the form after the form is submitted
                    form.reset();

                    // Clear the file input
                    $('#files').val('');
                }, 500);
            });
        });
    </script>


</body>

</html>
