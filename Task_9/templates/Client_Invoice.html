<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSpark Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/css/Client_Invoice.css">
    <style>
        #descr {
            font-size: 48px;
            color: #00a7aa;
            font-family: serif;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div id="gen-body">
        <div id="body">

            <div id="heading">

                <div id="main-blue">
                </div>

                <div id="logo">

                    <span id="logo-img">
                        <img src="/static/es_logo.png" alt="">
                    </span>

                    <div id="descr">
                        eSpark Portal
                    </div>

                    <div id="no-logs">
                        <a href="{% if user_role == 'admin' %}{% url 'admin_home' %}{% elif user_role == 'finance' %}{% url 'finance_home' %}{% endif %}"  id="home-link">
                            <p><b>Home</b></p>
                        </a>
                        <a href="/logout">
                            <p><b>Logout</b></p>
                        </a>
                    </div>

                </div>

                <div id="main-blue">
                </div>

            </div>

            <form action="" method="post" id="whole-form">
                {% csrf_token %}

                <div id="inv-desc">
                    <table>
                        <tr class="green-row">
                            <th>
                                INVOICE TO:
                                <input type="text" placeholder="..." name="inv_recipient" autocomplete="off" required>
                            </th>
                            <th class="sec-col-inv">
                                INVOICE DETAILS:&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;
                            </th>
                        </tr>

                        <tr class="nor-row">
                            <td>
                                ATTENTION:
                                <input type="text" placeholder="Mr. ..." name="attention" autocomplete="off" required>
                            </td>
                            <td class="sec-col-inv">
                                INVOICE NO: ...

                            </td>
                        </tr>

                        <tr class="nor-row">
                            <td>
                                THIS INVOICE IS PREPARED BY:
                                <input type="text" placeholder="..." name="prep_by" autocomplete="off" required>
                            </td>
                            <td class="sec-col-inv">
                                DATE:
                                <input type="date" placeholder="..." name="date" autocomplete="off" required>

                            </td>
                        </tr>

                    </table>
                </div>

                <div id="cont-info">
                    <table>
                        <tr class="green-row">
                            <th>
                                Contact Person:
                                <input type="text" placeholder="..." name="contact_per" autocomplete="off" required>
                            </th>
                        </tr>

                        <tr class="white-row">
                            <th>
                                Email:
                                <input type="email" placeholder="..." name="email" autocomplete="off" required>
                            </th>
                        </tr>
                    </table>
                </div>

                <div id="details">
                    <table>
                        <tr>
                            <th class="sr-no">Sr.No.</th>
                            <th class="item"> Item Name</th>
                            <th class="specs">Specification</th>
                            <th class="qty">Qty</th>
                            <th class="price">Unit Price</th>
                            <th class="amount">Amount</th>
                        </tr>
                        <tr id="dynamic-row-template" style="display: none;">
                            <td class="sr-no">
                                1
                            </td>
                            <td class="item"><input type="text" placeholder="..." name="item[]" autocomplete="off"></td>
                            <td class="specs"><input type="text" placeholder="..." name="specs[]" autocomplete="off">
                            </td>
                            <td class="qty"><input type="number" placeholder="..." name="qty[]" autocomplete="off"></td>
                            <td class="price"> <input type="number" placeholder="..." name="price[]" autocomplete="off">
                            </td>
                            <td class="amount"><input type="text" id="amount[]" value="0" readonly class="amnt"></td>
                        </tr>
                        <tr id="totals">
                            <td id="no-use" colspan="2"></td>
                            <td id="teeess" colspan="3">
                                Total
                            </td>
                            <td class="amount">
                                <input type="text" id="totalAmount" readonly value="Rs. 0">
                            </td>
                        </tr>
                    </table>
                    <button type="button" id="add-row">+</button>

                </div>

                <input type="submit" value="Submit">

            </form>

            <div id="foots">
                <div id="end-note">
                    <p>
                        &diams; This is a computer generated document and don't any signature
                    </p>
                </div>

                <div id="footer">
                    <div id="greens"></div>
                    <div id="greys"></div>
                    <div id="blues"></div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

    <script src="/static/js/Client_Invoice.js">
    </script>
</body>

</html>
