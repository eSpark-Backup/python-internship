<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Item</title>
    <style>
        body {
            background: linear-gradient(rgb(122, 187, 182), rgb(81, 131, 197));
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: fit-content;
        }

        .header-container .heading {
            display: flex;
            align-items: center;
        }

        .header-container .heading img {
            margin-left: 20px;
            padding-bottom: 10px;
            height: 70px;
            width: 70px;
        }

        .header-container .heading h2 {
            color: #ffffff;
            display: inline;
            padding: 10px;
            vertical-align: middle;
            font-size: 30px;
        }

        .header-container .nav-links {
            display: flex;
            align-items: center;
        }

        a.navs {
            color: #ffffff;
            display: inline;
            padding: 10px;
            vertical-align: middle;
            text-decoration: none;
            font-size: 25px;
            margin-right: 30px;
        }

        a.navs:hover {
            background-color: #d0e2ee5b;
            color: #ffffff;
        }

        .main-body {
            margin: auto;
            text-align: center;
            margin-top: 2%;
            margin-bottom: 10%;
        }

        .item_update {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .input-form {
            display: flex;
            align-items: center;
            margin: 10px;
            flex: 1;
        }

        form{
            background: #ffffff60;
            width: 50%;
        }

        .text {
            color: #ffffff;
            font-size: 25px;
            flex: 1;
            text-align: left;
            padding-left: 10px;
        }

        .enter-input {
            outline: none;
            size: 50px;
            font-size: 20px;
            flex: 2;
        }

        input[type='text'],
        input[type='number'] {
            height: 30px;
            background-color: #ffffff60;
            border: none;
            margin: 10px;
            color: #ffffff;
            text-align: left;
            flex: 2;
        }

        h1 {
            color: #ffffff;
            margin: 20px;
            font-size: 50px;
        }

        .btn {
            margin: 20px;
            background: #1186f388;
            border: none;
            color: #ffffff;
            font-size: 20px;
            font-family: serif;
            size: 20px;
        }

        footer {
            text-align: center;
            background: #ffffff60;
            color: #fff;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-container">
            <div class="heading">
                <img src="/static/logo.png" alt="">
                <h2>eSpark Inventory</h2>
            </div>

            <div class="nav-links">
                <a class="navs" href="/admin_home">
                    <p>Home</p>
                </a>

                <a class="navs" href="/logout">
                    <p>Logout</p>
                </a>
            </div>
        </div>
    </header>

    <div class="main-body">
        <div class="item_update">
            <form method="post" action="">
                {% csrf_token %}
                <h1>Add Item</h1>
                <div class="input-form">
                    <label class="text" for="Category">Category:</label>
                    <input type="text" class="enter-input" id="Category" name="Category" autocomplete="off" required>
                </div>

                <div class="input-form">
                    <label class="text" for="CategoryUrl">CategoryUrl:</label>
                    <input type="text" class="enter-input" id="CategoryUrl" name="CategoryUrl" autocomplete="off" pattern="https?://.+">
                </div>

                <div class="input-form">
                    <label class="text" for="CategoryDesc">CategoryDesc:</label>
                    <input type="text" class="enter-input" id="CategoryDesc" name="CategoryDesc" autocomplete="off" required>
                </div>

                <div class="input-form">
                    <label class="text" for="SubCategory">SubCategory:</label>
                    <input type="text" class="enter-input" id="SubCategory" name="SubCategory" autocomplete="off" required>
                </div>

                <div class="input-form">
                    <label class="text" for="SubCategoryUrl">SubCategoryUrl:</label>
                    <input type="text" class="enter-input" id="SubCategoryUrl" name="SubCategoryUrl" autocomplete="off" pattern="https?://.+">
                </div>

                <div class="input-form">
                    <label class="text" for="SubCategoryDesc">SubCategoryDesc:</label>
                    <input type="text" class="enter-input" id="SubCategoryDesc" name="SubCategoryDesc" autocomplete="off" required>
                </div>

                <div class="input-form">
                    <label class="text" for="ManufacturerPartNo">ManufacturerPartNo:</label>
                    <input type="text" class="enter-input" id="ManufacturerPartNo" name="ManufacturerPartNo" autocomplete="off" required>
                </div>

                <div class="input-form">
                    <label class="text" for="Manufacturer">Manufacturer:</label>
                    <input type="text" class="enter-input" id="Manufacturer" name="Manufacturer" autocomplete="off" required>
                </div>

                <div class="input-form">
                    <label class="text" for="ItemName">ItemName:</label>
                    <input type="text" class="enter-input" id="ItemName" name="ItemName" autocomplete="off" required>
                </div>

                <div class="input-form">
                    <label class="text" for="Description">Description:</label>
                    <input type="text" class="enter-input" id="Description" name="Description" autocomplete="off" required>
                </div>

                <div class="input-form">
                    <label class="text" for="Stock">Stock:</label>
                    <input type="number" class="enter-input" id="Stock" name="Stock" autocomplete="off" required>
                </div>

                <div class="input-form">
                    <label class="text" for="Price">Price:</label>
                    <input type="number" class="enter-input" id="Price" name="Price" step="any" autocomplete="off" required>
                </div>

                <div class="input-form">
                    <label class="text" for="Packaging">Packaging:</label>
                    <input type="text" class="enter-input" id="Packaging" name="Packaging" autocomplete="off">
                </div>

                <div class="input-form">
                    <label class="text" for="Series">Series:</label>
                    <input type="text" class="enter-input" id="Series" name="Series" autocomplete="off">
                </div>

                <div class="input-form">
                    <label class="text" for="DatasheetUrl">DatasheetUrl:</label>
                    <input type="text" class="enter-input" id="DatasheetUrl" name="DatasheetUrl" autocomplete="off" required pattern="https?://.+">
                </div>

                <div class="input-form">
                    <label class="text" for="ImageUrls">ImageUrls:</label>
                    <input type="text" class="enter-input" id="ImageUrls" name="ImageUrls" autocomplete="off" required pattern="https?://.+">
                </div>

                <div class="input-form">
                    <label class="text" for="Mounting Type">Mounting Type:</label>
                    <input type="text" class="enter-input" id="Mounting Type" name="Mounting Type" autocomplete="off">
                </div>

                <div class="input-form">
                    <label class="text" for="Package Case">Package Case:</label>
                    <input type="text" class="enter-input" id="Package Case" name="Package Case" autocomplete="off">
                </div>

                <div class="input-form">
                    <label class="text" for="AdditionalFields">AdditionalFields:</label>
                    <input type="text" class="enter-input" id="AdditionalFields" name="AdditionalFields" autocomplete="off">
                </div>

                <div>
                    {% if error_message %}
                    <div class="alert alert-danger" role="alert">{{ error_message }}</div>
                    {% endif %}
                </div>

                <button type="submit" class="btn">Update</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2023 eSpark Inventory. All rights reserved.</p>
    </footer>
</body>

</html>
