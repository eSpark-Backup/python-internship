<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <h2>Data Table 1</h2>
    <div>
        <table class="table table-dark table-striped">
            <tbody>
                {% for key, value in table_1.items %}
                <tr>
                    <td><b>{{ key }}</b></td>
                    <td>{{ value }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <h2>Data Table 2</h2>
    <div>
        <table class="table table-dark table-striped">
            <thead>
                <tr>
                    <th>Fuel</th>
                    <th>Percentage</th>
                </tr>
            </thead>
            <tbody>
                {% for key, value in table_2.items %}
                <tr>
                    <td>{{ key }}</td>
                    <td>{{ value }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <style>
        table {
            border-collapse: collapse;
            border: 10px;
            width: 18%;
        }
    
        th, td {
            border: 2px solid black;
            padding: 5px;
            text-align: center;
            background-color:#e1e6e4 ;
        }
    
        th {
            background-color: #acb6b2; /* Optional: Add a background color to table headers */
        }
    </style>
</body>
</html>
