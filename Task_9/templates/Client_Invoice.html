<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Invoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
        #no-logs{
            width: fit-content;
            margin-top: 40px;
            margin-left: 93%;
        }
        
        #no-logs a {
            text-decoration: none;
        }

        #no-logs a p {
            text-align: right;
            font-size: 30px;
            font-family: serif;
            color: #00B0B4;
        }

        #no-logs a:hover p {
            text-align: right;
            font-size: 30px;
            font-family: serif;
            color: #008688;
        }
        
        #body {
            margin: 40px;
        }

        header img {
            width: 100%;

        }

        #inv-desc table {
            width: 100%;
        }

        #inv-desc input {
            border: none;
            outline: none;
        }

        .sec-col-inv {
            text-align: right;
        }

        .green-row {
            background-color: #00A0A0;
        }

        .green-row th {
            font-family: 17px;
            color: #ffffff;
            font-weight: bold;
            font-family: sans-serif;
        }

        .green-row td {
            color: #ffffff;
            font-weight: 550;
            font-family: sans-serif;
            font-size: 16px;
        }

        .green-row input {
            background-color: #00A0A0;
            color: #ffffff;
            font-family: sans-serif;
            font-size: 16px;
            font-weight: bold;
            margin-left: 5px;
        }

        .nor-row {
            font-weight: 550;
            font-family: sans-serif;
            font-size: 16px;
        }

        .nor-row input {
            color: #00A0A0;
            font-weight: 550;
            font-family: sans-serif;
            font-size: 16px;
        }

        .white-row th {
            font-family: 17px;
            color: #00A0A0;
            font-weight: bold;
            font-family: sans-serif;
        }

        .white-row td {
            color: #00A0A0;
            font-weight: bold;
            font-family: sans-serif;
            font-size: 16px;
        }

        .white-row input {
            color: #00A0A0;
            font-family: sans-serif;
            font-size: 16px;
            font-weight: bold;
            margin-left: 5px;
        }

        #cont-info {
            margin-top: 10px;
        }

        #cont-info table {
            width: 100%;
        }

        #cont-info input {
            border: none;
            outline: none;
        }

        #details {
            margin-top: 50px;
        }

        #details table {
            width: 100%;
            font-size: 15px;
            border-collapse: collapse;
            font-weight: bold;
        }

        #details table .need-height {
            height: 150px;
        }

        #details table th {
            background-color: #00A0A0;
            color: #ffffff;
            text-align: center;
            border: solid black 1px;
            font-weight: bold;
        }

        #details table td {
            text-align: center;
            border: solid black 1px;
            font-weight: bold;
        }

        #details table input {
            border: none;
            outline: none;
            text-align: center;
            font-weight: bold;
        }

        .sr-no {
            width: 8%;
            font-weight: bold;
        }

        .item {
            width: 23%;
            padding: 3px;
        }

        .item input {
            width: 100%;
        }

        .specs {
            width: 31%;
            padding: 3px;
        }

        .specs input {
            width: 100%;
        }

        .qty {
            width: 7%;
            padding: 3px;
        }

        .qty input {
            width: 100%;
        }

        .price {
            width: 12%;
            padding: 3px;
        }

        .price input {
            width: 100%;
        }

        .amount {
            background-color: #00A0A0;
            color: #ffffff;
            width: 20%;
            padding: 3px;
        }

        .amount input {
            background-color: #00A0A0;
            color: #ffffff;
            width: 100%;
        }

        #details table #totals {
            height: 30px;
        }

        #details table #totals #no-use {
            border: none;
            width: 0;
            padding: 0;
            margin: 0;
        }

        #teeess {
            background-color: #00A0A0;
            color: #ffffff;
            font-weight: bold;
        }

        #end-note {
            font-family: sans-serif;
            font-size: 14px;
            margin-top: 5%;
            margin-bottom: 0;
        }

        footer {
            width: 100%;
        }

        footer img {
            width: 100%;
        }
    </style>

</head>

<body>

    <div id="no-logs">
        <a href="/logout">
            <p><b>Logout</b></p>
        </a>
    </div>

    <div id="body">
        <form action="">
            <header>
                <img src="/static/header_1.PNG" alt="">
            </header>

            <div id="inv-desc">
                <table>
                    <tr class="green-row">
                        <th>
                            INVOICE TO:
                            <input type="text" placeholder="...">
                        </th>
                        <th class="sec-col-inv">
                            INVOICE DETAILS:&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;
                        </th>
                    </tr>

                    <tr class="nor-row">
                        <td>
                            ATTENTION:
                            <input type="text" placeholder="Mr. ...">
                        </td>
                        <td class="sec-col-inv">
                            INVOICE NO:
                            <input type="text" placeholder="..." required>

                        </td>
                    </tr>

                    <tr class="nor-row">
                        <td>
                            THIS INVOICE IS PREPARED BY:
                            <input type="text" placeholder="...">
                        </td>
                        <td class="sec-col-inv">
                            DATE:
                            <input type="text" placeholder="..." required>

                        </td>
                    </tr>

                </table>
            </div>

            <div id="cont-info">
                <table>
                    <tr class="green-row">
                        <th>
                            Contact Person:
                            <input type="text" placeholder="..." required>
                        </th>
                    </tr>

                    <tr class="white-row">
                        <th>
                            Email:
                            <input type="text" placeholder="..." required>
                        </th>
                    </tr>
                </table>
            </div>

            <div id="details">
                <table>
                    <tr>
                        <th class="sr-no">Sr.No.</th>
                        <th class="item"> Item Name</th>
                        <th class="specs">Specification</th>
                        <th class="qty">Qty</th>
                        <th class="price">Unit Price</th>
                        <th class="amount">Amount</th>
                    </tr>
                    <tr class="need-height">
                        <td class="sr-no">
                            1
                        </td>
                        <td class="item">
                            <input type="text" placeholder="..." wrap="soft">
                        </td>
                        <td class="specs">
                            <input type="text" placeholder="..." wrap="soft">
                        </td>
                        <td class="qty">
                            <input type="text" placeholder="...">
                        </td>
                        <td class="price">
                            <input type="text" placeholder="...">
                        </td>
                        <td class="amount">
                            <input type="text" placeholder="...">
                        </td>
                    </tr>
                    <tr class="need-height">
                        <td class="sr-no">
                            2
                        </td>
                        <td class="item">
                            <input type="text" placeholder="..." wrap="soft">
                        </td>
                        <td class="specs">
                            <input type="text" placeholder="..." wrap="soft">
                        </td>
                        <td class="qty">
                            <input type="text" placeholder="...">
                        </td>
                        <td class="price">
                            <input type="text" placeholder="...">
                        </td>
                        <td class="amount">
                            <input type="text" placeholder="...">
                        </td>
                    </tr>
                    <tr class="need-height">
                        <td class="sr-no">
                            3
                        </td>
                        <td class="item">
                            <input type="text" placeholder="..." wrap="soft">
                        </td>
                        <td class="specs">
                            <input type="text" placeholder="..." wrap="soft">
                        </td>
                        <td class="qty">
                            <input type="text" placeholder="...">
                        </td>
                        <td class="price">
                            <input type="text" placeholder="...">
                        </td>
                        <td class="amount">
                            <input type="text" placeholder="...">
                        </td>
                    </tr>
                    <tr id="totals">
                        <td id="no-use" colspan="2"></td>
                        <td id="teeess" colspan="3">
                            Total
                        </td>
                        <td class="amount">
                            <input type="text" placeholder="...">
                        </td>
                    </tr>
                </table>
            </div>

        </form>
        <div id="end-note">
            <p>
                &diams; This is a computer generated document and don't required any signature
            </p>
        </div>

        <footer>
            <img src="/static/footer_1.PNG" alt="">
        </footer>


    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

</body>

</html>
