<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <title>Query Salary Slip</title>

    <style>
        body {
            background: linear-gradient(rgb(255, 255, 255), rgba(98, 184, 199, 0.466));
            background-size: cover;
            background-repeat: repeat;
            background-attachment: fixed;
        }

        #bodies {
            margin: 30px;
        }

        #main-blue {
            background-color: #01496D;
            height: 20px;
        }

        #logo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        #no-logs a {
            text-decoration: none;
        }

        #no-logs a p {
            display: inline;
            margin-left: 10px;
            text-align: right;
            font-size: 25px;
            font-family: serif;
            color: #00B0B4;
        }

        #no-logs a:hover p {
            color: #008688;
        }
        #main-body{
            font-family: serif;
            align-items: center;
            text-align: center;
            padding-top: 100px;
        }

        #input-container {
            display: flex;
            flex-direction: column;

        }

        input[type='text'],
        input[type='month'] {
            height: 30px;
            background-color: #87d1db67;
            border: none;
            margin: 10px;
            color: #00B0B4;
        }

        input[type='submit'] {
            display: block;
            margin: auto;
            margin-top: 20px;
            background-color: #00B0B4;
            border: none;
            width: 150px;
            border-radius: 10px;
            color: #ffffff;
            font-size: 25px;
            font-family: serif;
        }

        h1 {
            color: #00B0B4;
            margin: 20px;
            font-size: 50px;
        }

        #emp-id {
            outline: none;
            size: 50px;
            font-size: 20px;
        }

        #month {
            outline: none;
            size: 50px;
            font-size: 20px;
        }

        #ss {
            margin: 20px;
        }

        .label {
            color: #00B0B4;
            font-size: 30px;
        }

        #footer {
            position: absolute;
            bottom: 40px;
            width: 97%;
        }

        #greens {
            margin-top: 250px;
            padding: 3px;
            background-color: #00B0B4;
        }

        #greys {
            padding: 3px;
            background-color: #B5B5B5;
        }

        #blues {
            padding: 15px;
            background-color: #01496D;
        }
        
        #error{
            margin-top: 10px;
        }
        
        .alert{
            padding: 3px;
            width: 20%;
            margin: auto;
            border: none;
            border-radius: 0;
        }
    </style>

</head>

<body>
    <div id="bodies">
        <div id="heading">
            <div id="main-blue">
            </div>
            <div id="logo">
                <span id="logo-img">
                    <img src="/static/es_logo.png" alt="">
                </span>

                <div id="no-logs">
                    <a href="/home">
                        <p><b>Home</b></p>
                    </a>
                    
                    <a href="/logout">
                        <p><b>Logout</b></p>
                    </a>
                </div>
            </div>
            <div id="main-blue">
            </div>
        </div>

        <div id="main-body">
            <h1>Query Salary Slip</h1>
            <div id="input-container">
                <div id="ss">
                    <form method="post" action="{%url 'view_Salary_Slip'%}">
                        {% csrf_token %}
                        <label class="label" >Enter Employee ID:</label>
                        <input type="text" id="emp-id" name="emp_id" autocomplete="off">
                        <label class="label" >Enter Month:</label>
                        <input type="month" id="month" name="payroll_month" autocomplete="off">
                        <div id="error">
                            {% if error_message %}
                            <div class="alert alert-danger" role="alert">{{ error_message }}</div>
                            {% endif %}
                        </div>
                        <input type="submit" value="Query">
                    </form>
                </div>
            </div>
        </div>


        <div id="footer">
            <div id="greens"></div>
            <div id="greys"></div>
            <div id="blues"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

</body>

</html>
