<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <title>Query Result</title>
    <style>
.b-body {
            background: linear-gradient(rgb(122, 187, 182), rgb(81, 131, 197));
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .header-contr {
            padding: 10px ;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: fit-content;
        }

        .header-contr .headin {
            display: flex;
            align-items: center;
        }

        .header-contr .headin img {
            margin-left: 20px;
            padding-bottom: 10px;
            height: 80px;
            width: 70px;
        }

        .header-contr .headin h2 {
            color: #ffffff;
            display: inline;
            padding: 10px;
            vertical-align: middle;
            font-size: 30px;
            font-family: serif;
            font-weight: bold;
        }

        .header-contr .nav-links {
            display: flex;
            align-items: center;
        }

        a.navs {
            color: #ffffff;
            display: inline;
            padding: 10px;
            vertical-align: middle;
            text-decoration: none;
            font-size: 25px;
            font-family: serif;
            margin-right: 30px;
        }

        a.navs:hover {
            background-color: #d0e2ee5b;
            color: #ffffff;
        }

        .b-table {
            table-layout: fixed;
            border-collapse: collapse;
            width: auto;
            margin: auto;
            margin-top: 3%;
            margin-bottom: 10%;
            font-family: serif;
            color: #ffffff;
        }

        .b-table td,
        .b-table th{
            border: none;
            padding: 50px;
            text-align: center;
            background-color: hsla(0, 0%, 100%, 0.376);
            font-size: 30px;
            color: #ffffff;
        }

        footer {
            text-align: center;
            justify-content: center;
            padding-top: 10px;
            background: #ffffff60;
            color: #fff;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            font-family: serif;
            height: 50px;
        }
    </style>
</head>

<body class="b-body">

    <header>
        <div class="header-contr">
            <div class="headin">
                <img src="/static/logo.png" alt="">
                <h2>eSpark Inventory</h2>
            </div>

            <div class="nav-links">
                <a class="navs" href="/home">
                    <p>Home</p>
                </a>

                <a class="navs" href="/logout">
                    <p>Logout</p>
                </a>
            </div>
        </div>
    </header>

    <table class="b-table">
        <tbody>
            <tr>
                <th><b>Part Number</b></td>
                <th><b>Item Name</b></td>
                <th><b>Quantity</b></td>
            </tr>
            {% for result_part,query_item,result_quantity in item_view %}
            <tr>
                <td>{{ result_part }}</td>
                <td>{{ query_item }}</td>
                <td>{{ result_quantity }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <footer>
        <p>&copy; 2023 eSpark Inventory. All rights reserved.</p>
    </footer>

</body>

</html>
