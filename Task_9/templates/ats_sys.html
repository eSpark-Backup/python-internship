    <script>

        // Function to add a new row
        function addRow() {
            const template = $('#dynamic-sample').clone();
            template.removeAttr('id').show();
            template.val('');

            $('#folderForm input[type="text"]:last').after(template);
            attachEventListenersToDynamicRows();
        }

        $(document).ready(function () {
            $('#folderForm').on('submit', function (event) {
                // Prevent the default form submission
                event.preventDefault();

                // Show the loading spinner when the form is submitted
                $('#loading-spinner').show();

                // Serialize the form data
                var formData = new FormData(this);

                // Make an asynchronous AJAX request
                $.ajax({
                    type: 'POST',
                    url: $(this).attr('action'),
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function (data) {
                        // Hide the loading spinner after a successful response
                        $('#loading-spinner').hide();

                        // Check if the response contains an error message
                        if (data.error_message) {
                            // Display the error message
                            $('#error').html('<div class="alert alert-danger" role="alert">' + data.error_message + '</div>');
                            setTimeout(function () {
                                $('#error').html(''); // Remove the error message
                            }, 3000);
                        } else if (data.download_url) {
                            // Trigger a click on a hidden link to initiate the download
                            var link = document.createElement('a');
                            link.href = data.download_url;
                            link.download = 'shortlisted_candidates.zip';
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                        }
                    },
                });
            });

            // $('#folderForm').on('submit', function () {

            //     setTimeout(function () {

            //         form.reset();

            //         // Clear the file input
            //         $('#files').val('');
            //     }, 500);
            // });

            $('#add-row').click(function () {
                addRow();
            });
        });

    </script>
