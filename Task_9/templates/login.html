<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <title>Login</title>
    <style>
        body {
            background: linear-gradient(rgb(255, 255, 255), rgba(98, 184, 199, 0.466));
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        
        #bodies {
            margin: 30px;
        }

        #main-blue {
            background-color: #01496D;
            height: 20px;
        }

        #logo{
            margin-top: 10px;
            margin-bottom: 10px;
        }

        #div-form{
            background-color: #00A0A0;
            width: 600px;
            height: 400px;
            text-align: center;
            margin: auto;
            margin-top: 95px;
        }

        #div-form h2{
            padding-top: 10px;
            color: #ffffff;
            font-weight: bold;
            font-family: serif;
            font-size: 50px;
        }

        .login-data {
            padding: 30px;
            color: #ffffff;
            font-size: 20px;
            font-family: serif;
        }

        .login-data input{
            border: none;
            outline: none;
            background-color: #ffffff7a;
            color: #ffffff;
        }

        .button {
            margin: 10px;
            padding: 3px;
            background: #006dd3;
            border: none;
            color: #ffffff;
            font-size: 20px;
            font-family: serif;
            width: 150px;
            border-radius: 10px;
        }
        
        #greens {
            margin-top: 200px;
            padding: 3px;
            background-color: #00B0B4;
        }

        #greys {
            padding: 3px;
            background-color: #B5B5B5;
        }

        #blues {
            padding: 15px;
            background-color: #01496D;
        }

        .alert{
            padding: 3px;
        }

    </style>
</head>

<body>
    <div id="bodies">
        
        <div id="main-blue">
        </div>

        <div id="logo">
            <img src="/static/es_logo.PNG" alt="">
        </div>

        <div id="main-blue">
        </div>
        
        <div id="div-form">
            <h2>
                Login
            </h2>
            <form method="post">
                {% csrf_token %}

                <div class="login-data">
                    <label class="text" for="username">USERNAME: </label>
                    <input type="text" id="username" name="username" placeholder="Username" autocomplete="off" />
                </div>

                <div class="login-data">
                    <label class="text" for="password">PASSSWORD: </label>
                    <input type="password" id="password" name="password" placeholder="Password"
                        autocomplete="new-password" />
                </div>

                <div>
                    {% if error_message %}
                    <div class="alert alert-danger" role="alert">{{ error_message }}</div>
                    {% endif %}
                </div>

                <div>
                    <input type="submit" class="button" value="Submit" />
                </div>
            </form>
        </div>

        <div id="footer">
            <div id="greens"></div>
            <div id="greys"></div>
            <div id="blues"></div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>

</body>

</html>
